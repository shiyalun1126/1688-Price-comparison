[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "1688-price-compare-agent"
version = "0.1.0"
description = "以款找货源 + 比价的服装智能体（1688 单品级比价）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "Pillow>=10.0",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools]
# 只把 app 当发布包：scripts/ 与 tests/ 是本地脚本目录，若一并参与发现，
# setuptools 会判定 flat-layout 存在多个顶层包并直接拒绝构建（pip install -e . 失败）。
packages = { find = { include = ["app*"] } }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: 调用视觉/LLM 的慢测试（约 1~3 分钟），pytest -m 'not slow' 可跳过",
]